    kind: textarea
    when:
    - I9.3:
      - Storage in the Data Safe Haven is not suitable for my project for reasons outlined below
  I9.5:
    section: security
    question: Does your research involve electronic transmission, e.g., by email or file transfer, of records, statements
      or other documents/ data relating to terrorist or extremist groups, ideology or actions?
    kind: yes_no
    when:
    - I9:
      - c) Concerns terrorist or extremist groups, ideology or actions
  I9.6:
    section: security
    question: Will your research involve visits to websites that might be associated with terrorism or extremist
      organisations?
    kind: yes_no
    when:
    - I9:
      - c) Concerns terrorist or extremist groups, ideology or actions
  I9.7:
    section: security
    question: 'Please explain why transmission is required and your arrangements for ensuring data security:'
    kind: textarea
    when:
    - I9.5:
      - 'Yes'
  I9.8:
    section: security
    question: Websites associated with extremist or terrorist organisations may be subject to surveillance by the
      police. Accessing such sites might lead to police enquiries. You must only access these sites through the
      Virtual Desktop in the Data Safe Haven and transfer data directly to the DSH. This will ensure that these
      sites will only be accessed from a UCL IP address.
    kind: multi
    options:
    - I will only access security-sensitive websites through the Virtual Desktop in the Data Safe Haven (DSH).
