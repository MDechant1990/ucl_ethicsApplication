aims: This fictional project explores how adults, including neurodivergent adults, use tabletop
  and digital games to cope with everyday stress, and co-designs a community wellbeing toolkit
  and accessible game-night formats with players, venues and an industry partner.
benefits: The project will produce a freely available community wellbeing toolkit co-designed with
  and for gaming communities, and give participants a space to share experiences that shape it.
phases:
- name: Online survey
  location: online
  lab_location: ''
  duration_min: 30
  sample_size: 250
  sample_justification: Power analysis - 193 participants detect r = .20 with 80% power at
    alpha = .05; 250 allow for exclusions.
  methods:
  - survey
  instruments:
  - wemwbs
  - phq8
  - gad7
  custom_tools: []
- name: Interviews
  location: online
  lab_location: ''
  duration_min: 60
  sample_size: 20
  sample_justification: Standard for qualitative interview studies.
  methods:
