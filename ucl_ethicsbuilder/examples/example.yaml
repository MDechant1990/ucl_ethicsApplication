screening_method: own
screening_details: |-
  Participants confirm eligibility through yes/no questions at the start of the online survey and when signing up for interviews, workshops or the expo session. We ask whether they play tabletop or digital games at least once a month, and (optionally) whether they identify as neurodivergent; no diagnosis details are asked.

  Ineligible people see a message thanking them for their interest, without being told which answer excluded them, with links to general support services.
