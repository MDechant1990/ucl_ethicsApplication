# A fictional study used as the tool's example and test fixture. All people, organisations, numbers and
# events are invented. It deliberately combines many features (questionnaires, co-design at community
# venues, an event abroad, insider roles, an industry partner, incentives, paper consent) so that one file
# exercises most of the rules; tests derive simpler variants from it.
